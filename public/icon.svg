<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="My Workday Planner">
  <defs>
    <linearGradient id="tile" x1="46" y1="12" x2="472" y2="506" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3A6B"/>
      <stop offset="0.48" stop-color="#132542"/>
      <stop offset="1" stop-color="#070E1B"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(120 58) rotate(38) scale(340)">
      <stop offset="0" stop-color="#7FA8FF" stop-opacity="0.55"/>
      <stop offset="0.48" stop-color="#3E6FE8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3E6FE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="0" cy="0" r="1" gradientTransform="translate(430 470) rotate(-140) scale(300)">
      <stop offset="0" stop-color="#2FBF9B" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2FBF9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="256" y1="0" x2="256" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="monogram" x1="130" y1="150" x2="392" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FBFDFF"/>
      <stop offset="1" stop-color="#D3E2FF"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7F5DF"/>
      <stop offset="1" stop-color="#46C8F2"/>
    </linearGradient>
    <filter id="bevel" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#060C18" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="120" fill="url(#tile)"/>
  <rect width="512" height="512" rx="120" fill="url(#aura)"/>
  <rect width="512" height="512" rx="120" fill="url(#aura2)"/>

  <!-- glass sheen -->
  <path d="M0 120C0 53.7 53.7 0 120 0h272c66.3 0 120 53.7 120 120v22c-76 42-168 66-256 66S76 184 0 142v-22Z" fill="url(#glass)"/>

  <!-- crisp inner edge -->
  <rect x="6" y="6" width="500" height="500" rx="115" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="9"/>
  <rect x="16" y="16" width="480" height="480" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>

  <!-- monogram -->
  <g filter="url(#bevel)">
    <path d="M124 164 181 351.5c3.4 10.8 18.8 11.4 23.1 0.9L256 235.2l51.8 117.2c4.3 10.5 19.7 9.9 23.1-0.9L388 164"
      fill="none" stroke="url(#monogram)" stroke-width="43" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- spark -->
  <path d="M408 92.6 416.2 115.8 439.4 124 416.2 132.2 408 155.4 399.8 132.2 376.6 124 399.8 115.8Z" fill="url(#spark)"/>
</svg>
