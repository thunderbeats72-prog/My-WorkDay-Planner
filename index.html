<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta
      name="description"
      content="Private, local-first workday planner for business development: tasks, scheduling, timers, screenshot OCR and on-device insights."
    />
    <meta name="theme-color" content="#f5f5f6" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Workday" />

    <!-- The mark, everywhere a browser or platform asks for it. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon.svg" color="#17181d" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="My Workday Planner" />
    <meta property="og:title" content="Workday Planner — every task, deadline and hour in one quiet place" />
    <meta
      property="og:description"
      content="A private, local-first workday planner: one merged task list, an explainable daily plan, timers and on-device insights. No account, no sync, no upload."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Workday Planner" />
    <meta name="twitter:description" content="Every task, deadline and hour in one quiet place." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <script>
      /* Paint the right theme before the first pixel. The setting lives in
         IndexedDB, which cannot be read synchronously, so the resolved value is
         mirrored to localStorage by the app on every change. Without this a
         dark-mode reload flashes a light canvas for a few hundred milliseconds. */
      (function () {
        try {
          var saved = localStorage.getItem('workday.theme.v1');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0a0a0c' : '#f5f5f6');
        } catch (error) {
          /* A blocked localStorage must never stop the planner from starting. */
        }
      })();
    </script>
    <style>
      /* The first frame, before any stylesheet or script has loaded.
         A deliberate ink cover — the same idea as the onboarding panel — so a
         slow phone shows the brand instead of a white flash. */
      :root { color-scheme: light dark; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: #0b0b0e;
        color: #f4f4f6;
        font-family: 'Geist Variable', 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        transition: opacity 380ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 380ms;
      }
      #boot.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot svg { width: 74px; height: 74px; display: block; }
      #boot .arc { stroke-dasharray: 0 829; animation: boot-arc 900ms cubic-bezier(0.22, 1, 0.36, 1) 80ms forwards; }
      #boot .pin { opacity: 0; animation: boot-pin 320ms ease-out 760ms forwards; }
      #boot .word {
        margin: 0;
        font-size: 10.5px;
        font-weight: 560;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        animation: boot-word 620ms ease-out 220ms both;
      }
      #boot .rule {
        width: 132px;
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        border-radius: 999px;
      }
      #boot .rule i {
        display: block;
        height: 100%;
        width: 40%;
        background: rgba(255, 255, 255, 0.85);
        animation: boot-rule 1100ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-arc { to { stroke-dasharray: 537 829; } }
      @keyframes boot-pin { to { opacity: 1; } }
      @keyframes boot-word { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes boot-rule { from { transform: translateX(-110%); } to { transform: translateX(360%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .arc { animation: none; stroke-dasharray: 537 829; }
        #boot .pin { animation: none; opacity: 1; }
        #boot .word { animation: none; }
        #boot .rule i { animation: none; width: 100%; }
      }
    </style>

    <title>My Workday Planner</title>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 512 512" focusable="false">
        <rect width="512" height="512" rx="112" fill="#0B0B0D" />
        <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="6" />
        <circle cx="256" cy="256" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="30" />
        <circle class="arc" cx="256" cy="256" r="132" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-dasharray="0 829" transform="rotate(-90 256 256)" />
        <circle class="pin" cx="256" cy="124" r="17" fill="#0B0B0D" stroke="#FFFFFF" stroke-width="9" />
      </svg>
      <p class="word">Workday Planner</p>
      <span class="rule"><i></i></span>
    </div>
    <noscript>
      <style>
        #boot { display: none; }
      </style>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        My Workday Planner needs JavaScript enabled. Your data stays in this browser.
      </p>
    </noscript>
    <div id="root"></div>
    <script>
      /* If the bundle never arrives, do not leave a frozen logo on screen. */
      window.setTimeout(function () {
        var cover = document.getElementById('boot');
        if (cover && !cover.classList.contains('is-done')) cover.classList.add('is-done');
      }, 9000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
